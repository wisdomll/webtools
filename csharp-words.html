<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英文单词每日速记 · C# 方法速查</title>
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --card2:#273449;
  --txt:#e2e8f0; --sub:#94a3b8; --acc:#38bdf8; --ok:#22c55e; --bad:#f87171;
  --warn:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,#0f172a,#1e293b);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding:16px 14px 40px;max-width:760px;margin:0 auto}
h1{font-size:20px;display:flex;align-items:center;gap:8px}
h1 .logo{background:linear-gradient(135deg,#38bdf8,#6366f1);-webkit-background-clip:text;background-clip:text;color:transparent}
.date{color:var(--sub);font-size:13px;margin-top:4px}
.seg{display:flex;gap:8px;margin:16px 0 12px;background:var(--bg2);padding:5px;border-radius:14px}
.seg button{flex:1;padding:10px;border:none;border-radius:10px;background:transparent;color:var(--sub);font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.seg button.on{background:var(--acc);color:#06222e}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.btn{padding:9px 14px;border:none;border-radius:10px;background:var(--card2);color:var(--txt);font-size:14px;font-weight:600;cursor:pointer;border:1px solid #334155}
.btn.acc{background:var(--acc);color:#06222e}
.btn.warn{background:#5b4a26;color:#fde68a}
.hint{color:var(--sub);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:12px}
.study{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.study .w{font-size:22px;font-weight:800;color:#e0f2fe}
.study .p{color:var(--acc);font-size:15px;font-family:"Segoe UI",sans-serif}
.study .zh{color:var(--warn);font-weight:700;font-size:16px}
.detail{color:var(--sub);font-size:13px;margin-top:10px;border-top:1px dashed #334155;padding-top:10px;display:none}
.card.open .detail{display:block}
.card .toggle{color:var(--acc);font-size:12px;margin-top:8px;cursor:pointer;user-select:none}
.test-row{padding:12px 0;border-bottom:1px solid #1e293b}
.test-q{display:flex;justify-content:space-between;align-items:center;gap:8px}
.test-zh{font-size:16px;font-weight:700}
.test-cat{color:var(--sub);font-size:12px;background:var(--bg2);padding:2px 8px;border-radius:8px}
.test-input{width:100%;margin-top:8px;padding:11px 12px;border-radius:10px;border:1px solid #334155;background:#0b1524;color:#fff;font-size:16px}
.test-input:focus{outline:none;border-color:var(--acc)}
.test-result{margin-top:8px;font-size:14px;display:none;line-height:1.6}
.test-result .ans{color:#fff;font-weight:700}
.res-ok .test-result{display:block;color:var(--ok)}.res-ok .test-input{border-color:var(--ok)}
.res-bad .test-result{display:block;color:var(--bad)}.res-bad .test-input{border-color:var(--bad)}
.res-bad .ans{color:#fff}
.score{position:sticky;top:10px;z-index:5;background:var(--bg2);border:1px solid #334155;border-radius:14px;padding:12px 14px;margin-bottom:14px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.score b{font-size:22px;color:var(--acc)}
.score .ring{margin-top:6px;height:8px;background:#0b1524;border-radius:99px;overflow:hidden}
.score .ring i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#6366f1);width:0;transition:.5s;border-radius:99px}
.empty{color:var(--sub);text-align:center;padding:40px 0}
.week{font-size:12px;color:var(--sub);margin-top:6px}
.tag{font-size:12px;color:var(--warn)}
.adv{color:var(--sub);font-size:12px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<h1><span class="logo">◈ 每日单词速记</span></h1>
<div class="date" id="dateBox"></div>

<div class="seg">
  <button id="segStudy" class="on" onclick="mode('study')">📖 学习</button>
  <button id="segTest" onclick="mode('test')">✍️ 测试</button>
</div>

<div class="toolbar">
  <button class="btn acc" onclick="today()">◉ 今日10词</button>
  <button class="btn" onclick="fresh()">🎲 换一组</button>
  <button class="btn warn" onclick="resetAll()">↺ 重做本组</button>
 <button class="btn" onclick="exportProg()">📤 导出进度</button>
 <button class="btn" onclick="importProg()">📥 导入进度</button>
 <button class="btn" onclick="resetProg()">🗑 清空记录</button>
</div>
<div class="week" id="progBox" style="display:block;margin:6px 0 10px"></div>

<div id="weekHint" class="week" style="display:none"></div>

<div id="scoreBox" class="score"></div>

<div id="studyBox"></div>
<div id="testBox" style="display:none">
  <div class="hint">根据<b>中文翻译</b>填写英文单词（方法名）。填完点「提交」对答案。</div>
  <div id="testList"></div>
  <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
    <button class="btn acc" style="flex:1;padding:13px" onclick="submit()">✅ 提交答案</button>
    <button class="btn" style="flex:1;padding:13px" onclick="reveal()">👁 直接看答案</button>
  </div>
</div>

<div class="adv">题库共 258 词 · 测试答对自动记为「已掌握」，不再重复推送 · 数据保存在本机浏览器，换设备前记得「导出进度」</div>

": "Protected", "p": "/prəˈtektɪd/", "zh": "受保护的", "ex": "protected void Do()", "note": "当前类及子类可访问"}, {"cat": "十五、常用修饰符 关键字", "w": "Internal", "p": "/ɪnˈtɜːnl/", "zh": "程序集内", "ex": "internal void Do()", "note": "同一程序集可访问"}, {"cat": "十五、常用修饰符 关键字", "w": "Void", "p": "/vɔɪd/", "zh": "无返回值", "ex": "void Do()", "note": "方法不返回任何值"}, {"cat": "十五、常用修饰符 关键字", "w": "Return", "p": "/rɪˈtɜːn/", "zh": "返回", "ex": "return value;", "note": "从方法返回值或提前退出"}, {"cat": "十五、常用修饰符 关键字", "w": "Break", "p": "/breɪk/", "zh": "跳出循环", "ex": "break;", "note": "退出当前循环"}, {"cat": "十五、常用修饰符 关键字", "w": "Continue", "p": "/kənˈtɪnjuː/", "zh": "继续下次循环", "ex": "continue;", "note": "跳过本次循环剩余部分"}, {"cat": "十五、常用修饰符 关键字", "w": "Foreach", "p": "/fɔːr iːtʃ/", "zh": "遍历", "ex": "foreach (var x in list)", "note": "遍历可枚举集合"}, {"cat": "十五、常用修饰符 关键字", "w": "Yield", "p": "/jiːld/", "zh": "迭代返回", "ex": "yield return item;", "note": "延迟生成序列元素"}, {"cat": "十五、常用修饰符 关键字", "w": "Var", "p": "/vɑː/", "zh": "隐式类型", "ex": "var x = \"hello\"", "note": "编译器推断类型"}, {"cat": "十五、常用修饰符 关键字", "w": "Dynamic", "p": "/daɪˈnæmɪk/", "zh": "动态类型", "ex": "dynamic obj = \"hello\"", "note": "运行时确定类型"}, {"cat": "十五、常用修饰符 关键字", "w": "Nullable", "p": "/ˈnʌlɪəbl/", "zh": "可空类型", "ex": "int? x = null", "note": "值类型也能赋 null"}, {"cat": "十五、常用修饰符 关键字", "w": "Nameof", "p": "/neɪm ɒv/", "zh": "名称运算", "ex": "nameof(x) → \"x\"", "note": "获取变量/成员的字符串名称"}];
let cur=[];        // 当前批次的单词对象
let shuffled=[];   // 测试模式显示顺序
let attempts={};   // id -> user input
let seen=new Set();

function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function pickBySeed(n){const rnd=mulberry32(hash(todayStr()));const pool=[];const u=new Set();while(u.size<10&&pool.length<10){const i=Math.floor(rnd()*n);if(!u.has(i)){u.add(i);pool.push(i);}}return pool;}
function hash(s){let h=9;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),0x45d9f3b)}return h^h>>>16;}

function loadUnf(){try{return JSON.parse(localStorage.getItem('yunx_unf')||'[]')}catch(e){return[]}}
function saveUnf(a){localStorage.setItem('yunx_unf',JSON.stringify(a))}

function loadM(){try{return new Set(JSON.parse(localStorage.getItem('cs_mastered')||'[]'))}catch(e){return new Set()}}
function saveM(s){try{localStorage.setItem('cs_mastered',JSON.stringify([...s]))}catch(e){}}
function pickPool(rnd){
  const m=loadM();const un=[],mas=[];
  WORDS.forEach((w,i)=>{(m.has(w.w)?mas:un).push(i)});
  const src=un.length>=10?un:un.concat(mas);
  const u=new Set();const pool=[];
  while(pool.length<10&&u.size<src.length){const i=src[Math.floor(rnd()*src.length)];if(!u.has(i)){u.add(i);pool.push(i)}}
  return pool;
}
function today(){
  const rnd=mulberry32(hash(todayStr()));
  cur=pickPool(rnd).map(i=>WORDS[i]);
  render();updateProg();
}
function fresh(){
  const rnd=mulberry32(Math.floor(Math.random()*1e9));
  cur=pickPool(rnd).map(i=>WORDS[i]);
  render();updateProg();
}

function render(){
  attempts={};
  document.getElementById('scoreBox').style.display='none';
  const studyBox=document.getElementById('studyBox');
  const testBox=document.getElementById('testBox');
  if(modeNow==='study'){testBox.style.display='none';studyBox.style.display='block';renderStudy();}
  else{studyBox.style.display='none';testBox.style.display='block';shuffleTest();renderTest();}
  const todaySet=new Set(cur.map(w=>w.w));
  const left=WORDS.filter(w=>!todaySet.has(w.w));
  const u=loadUnf().filter(id=>WORDS[id]&&!todaySet.has(WORDS[id].w));
  const weekHint=document.getElementById('weekHint');
  if(weekHint)weekHint.style.display='none';
}

function renderStudy(){
  const b=document.getElementById('studyBox');const m2=loadM();
  b.innerHTML='<div class="hint">今日 10 词 · 点击卡片可展开示例说明</div>'+
   cur.map((w,i)=>`<div class="card study-card" onclick="this.classList.toggle('open')">
     <div style="flex:1;min-width:150px"><span class="tag">${i+1}</span> <span class="w">${esc(w['w'])}</span> <span class="p">${esc(w['p'])}</span></div>
     <div class="zh">${m2.has(w.w)?'✅ ':''}${esc(w['zh'])}</div>
     <div class="toggle">示例说明 ▾</div>
     <div class="detail">📦 示例：<code>${esc(w['ex'])}</code><br>💡 ${esc(w['note'])}<br>📂 ${esc(w['cat'])}</div></div>`).join('');
}

function shuffleTest(){shuffled=[...cur].sort(()=>Math.random()-0.5);}
function renderTest(){
  const b=document.getElementById('testList');
  b.innerHTML=shuffled.map((w,i)=>`<div class="card test-row" id="row${i}" data-i="${i}">
     <div class="test-q"><span class="test-zh">${esc(w['zh'])}</span><span class="test-cat">${esc(w['cat'].replace(/^.*?、/,''))}</span></div>
     <input class="test-input" data-i="${i}" placeholder="输入英文单词/方法名" autocomplete="off" autocapitalize="off" spellcheck="false">
     <div class="test-result">✅ <span class="ans">${esc(w['w'])}</span> <span style="color:var(--sub)">${esc(w['p'])}</span> · ${esc(w['note'])}</div>
   </div>`).join('');
  b.querySelectorAll('.test-input').forEach(inp=>inp.addEventListener('input',e=>{attempts[+e.target.dataset.i]=e.target.value}));
}

function norm(s){return (s||'').replace(/\s+/g,'').toLowerCase()}
function submit(){
  let ok=0;const m=loadM();
  shuffled.forEach((w,i)=>{
    const row=document.getElementById('row'+i);
    const inp=row.querySelector('.test-input');
    const val=inp.value;
    const good=norm(val)===norm(w['w']);
    if(good){ok++;m.add(w['w']);}
    row.classList.remove('res-ok','res-bad');
    row.classList.add(good?'res-ok':'res-bad');
    inp.readOnly=true;
  });
  saveM(m);showScore(ok);updateProg();
}
function reveal(){
  shuffled.forEach((w,i)=>{
    const row=document.getElementById('row'+i);
    row.classList.remove('res-ok','res-bad');row.classList.add('res-bad');
    row.querySelector('.test-input').readOnly=true;
  });
}
function showScore(ok){
  const s=document.getElementById('scoreBox');
  const pct=Math.round(ok/cur.length*100);
  const emoji=pct===100?'🏆':pct>=80?'🎉':pct>=60?'👍':'💪';
  s.style.display='block';
  s.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
    <div><b>${ok} / ${cur.length}</b> 正确 · ${emoji}</div><div>得分 ${pct}</div></div>
    <div class="ring"><i style="width:${pct}%"></i></div>`;
}
let modeNow='study';
function mode(m){modeNow=m;
  document.getElementById('segStudy').classList.toggle('on',m==='study');
  document.getElementById('segTest').classList.toggle('on',m==='test');
  render();
}
function resetAll(){render();}
function updateProg(){
 const m=loadM();const el=document.getElementById('progBox');
 if(el)el.innerHTML='📊 已掌握 <b style="color:var(--ok)">'+m.size+'</b> / '+WORDS.length+' 词'+(m.size>=WORDS.length?' 🏆 全部通关！':'');
}
function exportProg(){
 const code=btoa(unescape(encodeURIComponent(JSON.stringify([...loadM()]))));
 prompt('复制这串进度码保存好（换设备或清浏览器数据后，用「导入进度」可恢复）：',code);
}
function importProg(){
 const s=prompt('粘贴之前导出的进度码：','');
 if(!s)return;
 try{
  const arr=JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
  const valid=new Set(WORDS.map(w=>w.w));
  const m=new Set(arr.filter(x=>valid.has(x)));
  saveM(m);updateProg();today();
  alert('导入成功！已掌握 '+m.size+' / '+WORDS.length+' 词');
 }catch(e){alert('进度码无效，请检查是否复制完整')}
}
function resetProg(){
 if(confirm('确定清空全部学习记录，从零开始？')){
  saveM(new Set());updateProg();today();
 }
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

var _d=new Date();var _wd=['日','一','二','三','四','五','六'][_d.getDay()];document.getElementById('dateBox').textContent=todayStr()+' · 星期'+_wd;
today();
</script>
</body>
